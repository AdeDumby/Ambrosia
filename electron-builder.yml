appId: com.ambrosia.app
productName: Ambrosia
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
  - package.json
extraResources:
  - from: assets/icon.ico
    to: icon.ico
asarUnpack:
  - node_modules/@ffprobe-installer/**
win:
  target: nsis
  icon: assets/icon.ico
publish:
  provider: github
  owner: AdeDumby
  repo: Ambrosia
nsis:
  # No spaces: GitHub renames uploaded files, and the update file must match the installer name.
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
